name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Root package-lock.json (committed via KAN-101) covers both workspaces,
      # so a clean, reproducible install with npm ci + setup-node's npm cache.
      - name: Install dependencies
        run: npm ci

      # Fails the build if secrets are logged (KAN-99 / KAN-128).
      - name: Static logging check
        run: npm --workspace=backend run check:logging

      # Syntax-check all backend source files.
      - name: Backend build
        run: npm --workspace=backend run build

      # The test suite imports the Prisma client, which only exists after
      # `prisma generate` (there is no postinstall to run it). generate reads
      # the schema only — no DB connection — so a dummy DATABASE_URL suffices.
      - name: Generate Prisma client
        run: npm --workspace=backend exec -- prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Run the backend test suite (node:test). Tests mock Prisma, so no live
      # database is required. (KAN-160: previously the suite never ran in CI,
      # so a green 'Backend checks' did not mean tests passed.)
      - name: Backend tests
        run: npm --workspace=backend test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript type checking (tsc --noEmit). Catches missing props, type
      # mismatches, and broken imports before they land on dev.
      - name: Typecheck
        run: npm --workspace=frontend run typecheck

      # Production build (vite build). Verifies the SPA compiles correctly —
      # a broken build would prevent serving the site in prod.
      - name: Build
        run: npm --workspace=frontend run build

      # Run the frontend node:test suite (safeUrl utility tests). The vitest
      # suite (test:ui) is skipped here — it needs DOM stubs (localStorage)
      # that are not wired up in Node; that's a separate task.
      - name: Tests (node)
        run: npm --workspace=frontend run test:node
