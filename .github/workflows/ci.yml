name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Root package-lock.json (committed via KAN-101) covers both workspaces,
      # so a clean, reproducible install with npm ci + setup-node's npm cache.
      - name: Install dependencies
        run: npm ci

      # Fails the build if secrets are logged (KAN-99 / KAN-128).
      - name: Static logging check
        run: npm --workspace=backend run check:logging

      # Syntax-check all backend source files.
      - name: Backend build
        run: npm --workspace=backend run build

      # Run the backend test suite (node:test). Tests mock Prisma, so no live
      # database is required. (KAN-160: previously the suite never ran in CI,
      # so a green 'Backend checks' did not mean tests passed.)
      - name: Backend tests
        run: npm --workspace=backend test
