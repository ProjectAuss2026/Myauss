# KAN-101: CI security gates — dependency audit + secret scanning
# Fails PRs and pushes to dev/main on high/critical vulnerabilities or leaked secrets.
name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # Audits the committed package-lock.json (root lockfile covers both
      # workspaces). Includes dev dependencies — postinstall scripts in dev
      # deps are still a supply-chain risk.
      #
      # Wrapped rather than calling `npm audit --audit-level=high` directly so a
      # vulnerability we have assessed as unreachable can be allowlisted with a
      # written reason and an expiry date, instead of the gate being switched
      # off wholesale. See scripts/audit-allowlist.json.
      - name: Audit dependencies
        run: npm run audit:ci

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits in the PR
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
