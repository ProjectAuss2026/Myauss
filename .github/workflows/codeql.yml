# KAN-101: CodeQL static analysis
# Free for public repos. Private repos require GitHub Advanced Security.
name: CodeQL

on:
  # KAN-160: scan dev too, not just main. main is stale (no workflows dir), so
  # main-only meant CodeQL effectively never ran on a branch. Matches ci.yml /
  # security.yml, which already gate [main, dev].
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * 1" # weekly Monday scan

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
